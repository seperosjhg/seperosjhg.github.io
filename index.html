<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조현규 | 비개발자의 AI 일 덜기</title>
<meta name="description" content="공공 IT 15년차 사업관리자 조현규(아이엠조차장)의 글, 강의, AI 자동화 세팅 포트폴리오">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
/* =====================================================================
   Montage kit for plain HTML (Wanted Design System, MIT)
   Source: github.com/wanteddev/montage-web packages/theme + packages/core styles
   Usage: paste into <style>. Set <html data-theme="dark"> (default) or "light".
   Font: <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
   ===================================================================== */
:root{
  --font: "Wanted Sans Variable","Wanted Sans","Pretendard",-apple-system,"Malgun Gothic",sans-serif;
  /* atomic */
  --blue-40:#0054D1; --blue-45:#005EEB; --blue-50:#0066FF; --blue-55:#1A75FF; --blue-60:#3385FF; --blue-95:#EAF2FE;
  --green-50:#00BF40; --green-60:#1ED45A; --orange-50:#FF9200; --orange-60:#FFA938; --red-50:#FF4242; --red-60:#FF6363;
  --violet-50:#6541F2; --violet-60:#7D5EF7; --cyan-50:#00BDDE; --cyan-60:#28D0ED; --lime-50:#58CF04;
  /* radius (px) */
  --r-4:4px; --r-8:8px; --r-10:10px; --r-12:12px; --r-14:14px; --r-16:16px; --r-20:20px; --r-24:24px; --r-full:9999px;
  /* elevation (same in both themes) */
  --shadow-xs:0 1px 2px -1px rgba(23,23,23,.10);
  --shadow-s:0 2px 4px -2px rgba(23,23,23,.06),0 4px 6px -1px rgba(23,23,23,.06);
  --shadow-m:0 4px 6px -2px rgba(23,23,23,.07),0 10px 15px -3px rgba(23,23,23,.07);
  --shadow-l:0 6px 10px -4px rgba(23,23,23,.08),0 16px 24px -6px rgba(23,23,23,.08);
  --shadow-xl:0 10px 15px -5px rgba(23,23,23,.10),0 24px 38px -10px rgba(23,23,23,.12);
}
/* semantic: dark (user default) */
[data-theme="dark"]{
  --bg:#1B1C1E;               /* background.neutral.primary (coolNeutral 15) */
  --bg-2:#0F0F10;             /* background.neutral.secondary (coolNeutral 5) */
  --surface:#1B1C1E;          /* surface.neutral.primary */
  --surface-2:rgba(112,115,124,.22); --surface-3:rgba(112,115,124,.12); --surface-strong:rgba(112,115,124,.28);
  --elevated:#212225; --elevated-2:#141415;
  --fg:#F7F7F8; --fg-strong:#FFFFFF; --fg-2:rgba(194,196,200,.88); --fg-3:rgba(174,176,182,.61); --fg-4:rgba(174,176,182,.28);
  --fg-disable:rgba(152,155,162,.16); --surface-disable:#2E2F33;
  --line:rgba(112,115,124,.32); --line-2:rgba(112,115,124,.28); --line-3:rgba(112,115,124,.22);
  --brand:#3385FF; --brand-strong:#1A75FF; --brand-subtle:rgba(51,133,255,.05); --brand-line:rgba(51,133,255,.28); --brand-focus:rgba(51,133,255,.12);
  --positive:#1ED45A; --cautionary:#FFA938; --negative:#FF6363;
  --positive-bg:rgba(30,212,90,.08); --cautionary-bg:rgba(255,169,56,.08); --negative-bg:rgba(255,99,99,.08);
}
/* semantic: light */
[data-theme="light"]{
  --bg:#FFFFFF; --bg-2:#F7F7F8;
  --surface:#FFFFFF;
  --surface-2:rgba(112,115,124,.08); --surface-3:rgba(112,115,124,.05); --surface-strong:rgba(112,115,124,.16);
  --elevated:#FFFFFF; --elevated-2:#F7F7F8;
  --fg:#171719; --fg-strong:#000000; --fg-2:rgba(46,47,51,.88); --fg-3:rgba(55,56,60,.61); --fg-4:rgba(55,56,60,.28);
  --fg-disable:rgba(55,56,60,.16); --surface-disable:#F4F4F5;
  --line:rgba(112,115,124,.22); --line-2:rgba(112,115,124,.16); --line-3:rgba(112,115,124,.08);
  --brand:#0066FF; --brand-strong:#005EEB; --brand-subtle:rgba(0,102,255,.05); --brand-line:rgba(0,102,255,.28); --brand-focus:rgba(0,102,255,.12);
  --positive:#00BF40; --cautionary:#FF9200; --negative:#FF4242;
  --positive-bg:rgba(0,191,64,.08); --cautionary-bg:rgba(255,146,0,.08); --negative-bg:rgba(255,66,66,.08);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:24px;letter-spacing:.0057em;-webkit-font-smoothing:antialiased}

/* ---------- Typography (size/line-height, letter-spacing; bold = 700 up to title3, 600 below) ---------- */
.t-display1{font-size:56px;line-height:72px;letter-spacing:-.0319em;font-weight:700}
.t-display2{font-size:40px;line-height:52px;letter-spacing:-.0282em;font-weight:700}
.t-display3{font-size:36px;line-height:48px;letter-spacing:-.027em;font-weight:700}
.t-title1{font-size:32px;line-height:44px;letter-spacing:-.0253em;font-weight:700}
.t-title2{font-size:28px;line-height:38px;letter-spacing:-.0236em;font-weight:700}
.t-title3{font-size:24px;line-height:32px;letter-spacing:-.023em;font-weight:700}
.t-heading1{font-size:22px;line-height:30px;letter-spacing:-.0194em;font-weight:600}
.t-heading2{font-size:20px;line-height:28px;letter-spacing:-.012em;font-weight:600}
.t-headline1{font-size:18px;line-height:26px;letter-spacing:-.002em;font-weight:600}
.t-headline2{font-size:17px;line-height:24px;letter-spacing:0;font-weight:600}
.t-body1{font-size:16px;line-height:24px;letter-spacing:.0057em}
.t-body1r{font-size:16px;line-height:26px;letter-spacing:.0057em}
.t-body2{font-size:15px;line-height:22px;letter-spacing:.0096em}
.t-body2r{font-size:15px;line-height:24px;letter-spacing:.0096em}
.t-label1{font-size:14px;line-height:20px;letter-spacing:.0145em}
.t-label1r{font-size:14px;line-height:22px;letter-spacing:.0145em}
.t-label2{font-size:13px;line-height:18px;letter-spacing:.0194em}
.t-caption1{font-size:12px;line-height:16px;letter-spacing:.0252em}
.t-caption2{font-size:11px;line-height:14px;letter-spacing:.0311em}
.w-r{font-weight:400}.w-m{font-weight:500}.w-b{font-weight:600}
.c-strong{color:var(--fg-strong)}.c-2{color:var(--fg-2)}.c-3{color:var(--fg-3)}.c-brand{color:var(--brand)}

/* ---------- Layout ---------- */
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
@media (min-width:768px){.container{padding:0 40px}}
/* breakpoints: sm 768, md 992, lg 1200, xl 1600. Mobile = 767px 이하 */

/* ---------- Button (height fixed per size; radius never changed) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;font-family:inherit;font-weight:600;text-decoration:none;white-space:nowrap;position:relative;transition:filter .12s}
.btn-l{min-height:48px;padding:13px 20px;border-radius:var(--r-14);font-size:15px;line-height:22px}   /* body2 bold */
.btn-m{min-height:40px;padding:10px 16px;border-radius:var(--r-12);font-size:14px;line-height:20px;gap:4px} /* label1 bold */
.btn-s{min-height:32px;padding:8px 12px;border-radius:var(--r-10);font-size:12px;line-height:16px;gap:4px} /* caption1 bold */
.btn-xs{min-height:28px;padding:6px 10px;border-radius:var(--r-8);font-size:12px;line-height:16px;gap:4px}
.btn-solid-primary{background:var(--brand);color:#fff}
.btn-solid-assistive{background:var(--surface-2);color:var(--fg-2)}
.btn-solid-negative{background:var(--negative-bg);color:var(--negative)}
.btn-outlined-primary{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-outlined-assistive{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn:hover{filter:brightness(1.06)} .btn:active{filter:brightness(.94)}
.btn[disabled]{background:var(--surface-disable);color:var(--fg-disable);box-shadow:none;cursor:default}

/* ---------- Text button (no bg/border) ---------- */
.tbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:5px 0;min-height:32px;font:inherit;font-size:15px;line-height:22px;font-weight:600;color:var(--brand);cursor:pointer;text-decoration:none}
.tbtn-s{min-height:28px;padding:4px 0;font-size:14px;line-height:20px}
.tbtn.assistive{color:var(--fg-2)}

/* ---------- Chip (clickable value / filter) ---------- */
.chip{display:inline-flex;align-items:center;gap:2px;font-family:inherit;font-weight:500;cursor:pointer;background:transparent;color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line-2);border:0}
.chip-l{min-height:40px;padding:10px 12px;border-radius:var(--r-12);font-size:14px;line-height:20px}
.chip-m{min-height:36px;padding:9px 10px;border-radius:var(--r-10);font-size:13px;line-height:18px}
.chip-s{min-height:32px;padding:8px;border-radius:var(--r-10);font-size:12px;line-height:16px}
.chip.is-active{background:var(--fg);color:var(--bg);box-shadow:none}

/* ---------- Content badge (label only, never clickable) ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-weight:500;width:fit-content}
.badge-m{padding:5px 8px;border-radius:var(--r-10);font-size:13px;line-height:18px}
.badge-s{padding:4px 6px;border-radius:var(--r-8);font-size:12px;line-height:16px}
.badge-xs{padding:3px 6px;border-radius:var(--r-8);font-size:11px;line-height:14px;gap:2px}
.badge-neutral{background:var(--surface-2);color:var(--fg-2)}
.badge-brand{background:var(--brand-focus);color:var(--brand)}
.badge-positive{background:var(--positive-bg);color:var(--positive)}
.badge-cautionary{background:var(--cautionary-bg);color:var(--cautionary)}
.badge-negative{background:var(--negative-bg);color:var(--negative)}
.badge-outlined{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--fg-2)}
.badges{display:flex;flex-wrap:wrap;gap:6px}  /* 8px when medium */

/* ---------- Card (thumbnail 3:2 desktop / 4:3 mobile, radius 12, heading 2 lines, caption 1 line) ---------- */
.card{display:flex;flex-direction:column;gap:12px;color:inherit;text-decoration:none}
.card-thumb{width:100%;aspect-ratio:3/2;border-radius:var(--r-12);overflow:hidden;background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line-3)}
.card-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{display:flex;flex-direction:column;gap:4px}
.card-heading{font-size:16px;line-height:24px;font-weight:600;color:var(--fg-strong);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-caption{font-size:13px;line-height:18px;font-weight:500;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:767px){.card-thumb{aspect-ratio:4/3}.card-heading{font-size:15px;line-height:22px}}
/* Box card (no thumbnail): surface + 1px line, radius 16, padding 20-24 */
.box{background:var(--elevated);border-radius:var(--r-16);padding:20px;box-shadow:inset 0 0 0 1px var(--line-3)}

/* ---------- List card (thumb 120px desktop / 96px mobile, heading/caption 1 line) ---------- */
.lcard{display:flex;gap:16px;align-items:center;color:inherit;text-decoration:none;padding:12px 0}
.lcard-thumb{flex:0 0 120px;aspect-ratio:3/2;border-radius:var(--r-12);overflow:hidden;background:var(--surface-3)}
.lcard-heading{font-size:16px;line-height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard-caption{font-size:13px;line-height:18px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard + .lcard{border-top:1px solid var(--line-3)}
@media (max-width:767px){.lcard{gap:12px}.lcard-thumb{flex-basis:96px}}

/* ---------- Section header (title max 2 lines; trailing aligned to baseline) ---------- */
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.shead h2,.shead h3{margin:0;color:var(--fg-strong);font-weight:700}
.shead-l h2{font-size:28px;line-height:38px;letter-spacing:-.0236em}   /* desktop large */
.shead-m h2{font-size:22px;line-height:30px;letter-spacing:-.0194em;font-weight:600}
@media (max-width:767px){.shead-l h2{font-size:24px;line-height:32px}.shead-m h2{font-size:20px;line-height:28px}}

/* ---------- Tab (underline 2px, gap 20px) ---------- */
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line-3);overflow-x:auto}
.tab{position:relative;padding:12px 0;font:inherit;font-size:17px;line-height:24px;font-weight:600;color:var(--fg-3);background:none;border:0;cursor:pointer;white-space:nowrap}
.tab.is-active{color:var(--fg-strong)}
.tab.is-active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--fg-strong)}

/* ---------- Table (desktop only; head 44px, cell padding 16/20, numbers right-aligned) ---------- */
.table-wrap{border-radius:var(--r-12);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-3)}
.table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
.table th{height:44px;padding:8px 20px;text-align:left;font-weight:600;color:var(--fg-3);background:var(--surface-3);font-size:13px}
.table td{min-height:44px;padding:16px 20px;border-top:1px solid var(--line-3);color:var(--fg)}
.table .num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Section message (inline notice, radius 12, padding 12) ---------- */
.smsg{display:flex;gap:8px;padding:12px;border-radius:var(--r-12);font-size:14px;line-height:22px;background:var(--surface-3);color:var(--fg-2)}
.smsg.info{background:var(--brand-subtle);color:var(--fg)} .smsg.positive{background:var(--positive-bg)} .smsg.cautionary{background:var(--cautionary-bg)} .smsg.negative{background:var(--negative-bg)}

/* ---------- Top navigation (min-height 56, padding 16) ---------- */
.topnav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-3)}
.topnav-in{display:flex;align-items:center;gap:20px;min-height:56px}

/* ---------- Fallback view (empty / error) ---------- */
.fallback{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 20px;text-align:center;color:var(--fg-3)}

/* ---------- Focus (accessibility) ---------- */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ===== page layout (kit 변수만 사용) ===== */
html{scroll-behavior:smooth}
a{color:inherit}
.hero{padding-top:80px;padding-bottom:64px}
#themeBtn{margin-left:auto}
.nav-links + #themeBtn{margin-left:0}
.hero .lead{margin-top:20px;max-width:680px}
.hero .cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:48px}
.facts .box{display:flex;flex-direction:column;gap:4px}
section{padding:64px 0;border-top:1px solid var(--line-3)}
.shead p{margin:0;max-width:480px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.grid .box{display:flex;flex-direction:column;gap:8px;text-decoration:none;transition:box-shadow .15s}
a.box:hover{box-shadow:inset 0 0 0 1px var(--brand-line)}
.grid .box .tbtn{margin-top:auto}
.tl{display:grid;grid-template-columns:140px 1fr;gap:24px;padding:20px 0}
.tl + .tl{border-top:1px solid var(--line-3)}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.channels .box{display:flex;justify-content:space-between;align-items:center;text-decoration:none;padding:16px 20px}
.nav-links{display:flex;gap:20px;margin-left:auto}
.nav-links a{text-decoration:none}
footer{padding:48px 0 64px;border-top:1px solid var(--line-3)}
@media (max-width:767px){
  .hero{padding-top:48px;padding-bottom:40px} .facts{grid-template-columns:repeat(2,1fr)}
  .nav-links{display:none} .nav-links + #themeBtn{margin-left:auto} .tl{grid-template-columns:1fr;gap:4px}
  .shead{flex-direction:column;align-items:flex-start}
  .hero h1{font-size:28px;line-height:38px;letter-spacing:-.0236em}
}
</style>
</head>
<body>
<header class="topnav"><div class="container topnav-in">
  <a href="#top" class="t-headline1 c-strong" style="text-decoration:none">조현규</a>
  <nav class="nav-links t-label1 c-2"><a href="#writing">글</a><a href="#talks">강의</a><a href="#cases">세팅 사례</a><a href="#tools">만든 도구</a><a href="#contact">연락</a></nav>
  <button class="btn btn-s btn-outlined-assistive" id="themeBtn">밝게</button>
</div></header>

<main id="top">
  <div class="container hero">
    <span class="badge badge-m badge-brand" id="heroEyebrow"></span>
    <h1 class="t-display2 c-strong" id="heroTitle" style="margin:20px 0 0;max-width:760px"></h1>
    <p class="lead t-headline1 w-r c-2" id="heroLead"></p>
    <div class="cta">
      <a class="btn btn-l btn-solid-primary" id="ctaPrimary" target="_blank" rel="noopener"></a>
      <a class="btn btn-l btn-outlined-assistive" href="#writing">쓴 글 보기</a>
    </div>
    <div class="facts" id="facts"></div>
  </div>

  <section id="writing"><div class="container">
    <div class="shead shead-l"><h2>글</h2><p class="t-body1 c-2">현장에서 직접 해 본 것만 씁니다. 코딩을 몰라도 따라 할 수 있게.</p></div>
    <div class="grid" id="writingList"></div>
  </div></section>

  <section id="talks"><div class="container">
    <div class="shead shead-l"><h2>강의와 교육</h2><p class="t-body1 c-2">"생각만 하고 시작 못 한 분들이 숟가락을 드는 방법"을 알려 드립니다.</p></div>
    <div id="talkList"></div>
  </div></section>

  <section id="cases"><div class="container">
    <div class="shead shead-l"><h2>찾아가는 AI 홍보 자동화 세팅</h2><p class="t-body1 c-2">직접 찾아가 블로그와 스레드 홍보가 알아서 굴러가도록 세팅해 드립니다.</p></div>
    <div class="grid" id="caseList"></div>
  </div></section>

  <section id="tools"><div class="container">
    <div class="shead shead-l"><h2>만든 도구</h2><p class="t-body1 c-2">귀찮고, 단순한데 양이 많고, "이런 것까지 내가 해야 해?" 싶은 일은 도구로 만듭니다.</p></div>
    <div class="grid" id="toolList"></div>
  </div></section>

  <section id="contact"><div class="container">
    <div class="shead shead-l"><h2>채널과 연락</h2><p class="t-body1 c-2">강의, 기고, 세팅 문의는 리틀리 문의 폼으로 받습니다.</p></div>
    <div class="channels" id="channelList"></div>
  </div></section>
</main>

<footer><div class="container t-caption1 c-3" id="footer"></div></footer>

<script>
/* =====================================================================
   여기만 고치면 홈페이지가 바뀝니다. (항목 추가 = 줄 하나 복사)
   - hidden: true 로 두면 화면에 안 나옵니다.
   - 〔확인〕이 붙은 칸은 공개 전에 사실을 확인하고 지우세요.
   ===================================================================== */
const DATA = {
  updated: '2026-11-13',
  hero: {
    eyebrow: '아이엠조차장 · 비개발자의 AI 일 덜기',
    title: '양이 아니라 부하를 덜어내는 AI 활용을 씁니다',
    lead: '공공 IT 15년차, 그중 사업관리 12년. 코딩은 모르지만 AI로 내 일을 덜어낸 과정을 글로 쓰고, 강의하고, 필요한 분께 직접 세팅해 드립니다.',
    cta: { label: '문의하기', url: 'https://litt.ly/ai_workdiet' }
  },
  facts: [
    { value: '15년차', label: '공공 IT 현장' },
    { value: '12년', label: '사업관리' },
    { value: '5개 매체', label: '요즘IT·퍼블리·브런치·오마이뉴스·미디엄' },
    { value: '4곳', label: '찾아가는 자동화 세팅' }

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vis = a => a.filter(x => !x.hidden);
const box = (url, inner) => url ? `<a class="box" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="box">${inner}</div>`;

$('heroEyebrow').textContent = DATA.hero.eyebrow;
$('heroTitle').textContent = DATA.hero.title;
$('heroLead').textContent = DATA.hero.lead;
$('ctaPrimary').textContent = DATA.hero.cta.label; $('ctaPrimary').href = DATA.hero.cta.url;
$('facts').innerHTML = DATA.facts.map(f => `<div class="box"><span class="t-title3 c-strong">${esc(f.value)}</span><span class="t-label1 c-3">${esc(f.label)}</span></div>`).join('');

$('writingList').innerHTML = vis(DATA.writing).map(w => box(w.url,
  `<div class="badges"><span class="badge badge-s badge-brand">${esc(w.media)}</span><span class="badge badge-s badge-outlined">${esc(w.date)}</span></div>
   <div class="card-heading">${esc(w.title)}</div><div class="t-label2 c-3">${esc(w.note)}</div>${w.url ? '<span class="tbtn tbtn-s">읽으러 가기 →</span>' : ''}`)).join('');

$('talkList').innerHTML = vis(DATA.talks).map(t =>
  `<div class="tl"><div class="t-label1 c-3">${esc(t.date)}</div><div><div class="t-heading2 c-strong">${esc(t.title)}</div><p class="t-body1 c-2" style="margin:4px 0 0">${esc(t.desc)}</p></div></div>`).join('');

$('caseList').innerHTML = vis(DATA.cases).map(c => box(null,
  `<div class="badges"><span class="badge badge-s badge-neutral">${esc(c.field)}</span></div><div class="card-heading">${esc(c.title)}</div><div class="t-label1 c-2">${esc(c.desc)}</div>`)).join('');

$('toolList').innerHTML = vis(DATA.tools).map(t => box(t.url,
  `<div class="badges"><span class="badge badge-s badge-neutral">${esc(t.tag)}</span></div><div class="card-heading">${esc(t.title)}</div><div class="t-label1 c-2">${esc(t.desc)}</div>${t.url ? '<span class="tbtn tbtn-s">열어 보기 →</span>' : ''}`)).join('');

$('channelList').innerHTML = vis(DATA.channels).map(c =>
  `<a class="box" href="${esc(c.url)}" target="_blank" rel="noopener"><span><span class="t-headline2 c-strong" style="display:block">${esc(c.name)}</span><span class="t-caption1 c-3">${esc(c.handle)}</span></span><span class="c-3">→</span></a>`).join('');

$('footer').textContent = `© 조현규 · 마지막 업데이트 ${DATA.updated} · 디자인: Wanted Montage (MIT), 글꼴: Wanted Sans (OFL)`;

const root = document.documentElement, btn = $('themeBtn');
const setTheme = t => { root.dataset.theme = t; btn.textContent = t === 'dark' ? '밝게' : '어둡게'; try{ localStorage.setItem('pf-theme', t); }catch(e){} };
setTheme((()=>{ try{ return localStorage.getItem('pf-theme') || 'dark'; }catch(e){ return 'dark'; } })());
btn.onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
